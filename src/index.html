<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dashboard Template</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the theme before the app boots so a dark-mode reload doesn't flash light.
      // ThemeService owns the preference afterwards; this only mirrors its first read.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('app.theme'); } catch (e) {}
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
