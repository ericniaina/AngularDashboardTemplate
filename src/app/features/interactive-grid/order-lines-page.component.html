<app-page-header [title]="'orders.title' | transloco" [subtitle]="'orders.subtitle' | transloco">
  <button
    hlmBtn
    variant="outline"
    type="button"
    [disabled]="!store.dirty() || store.saving()"
    (click)="discard()"
  >
    <ng-icon name="lucideUndo2" />
    {{ 'orders.actions.discard' | transloco }}
  </button>
  <button hlmBtn type="button" [disabled]="!store.canSave()" (click)="save()">
    @if (store.saving()) {
      <hlm-spinner class="size-4" />
    } @else {
      <ng-icon name="lucideSave" />
    }
    {{ 'common.actions.save' | transloco }}
  </button>
</app-page-header>

<app-data-table
  [label]="'orders.title' | transloco"
  [rows]="store.loaded() ? store.lines() : null"
  [columns]="columns()"
  [rowId]="rowId"
  [loading]="store.loading()"
  [filters]="false"
  [pagination]="false"
  [selectable]="true"
  [(selected)]="selectedIds"
  [footer]="store.loaded() ? footer() : null"
  height="32rem"
>
  <ng-container tableActions>
    <button hlmBtn variant="outline" type="button" [disabled]="store.loading()" (click)="addLine()">
      <ng-icon name="lucidePlus" />
      {{ 'orders.actions.add' | transloco }}
    </button>
    <input #csvInput type="file" accept=".csv,text/csv" hidden (change)="importCsv($event)" />
    <button
      hlmBtn
      variant="outline"
      type="button"
      [disabled]="store.loading()"
      (click)="csvInput.click()"
    >
      <ng-icon name="lucideUpload" />
      {{ 'orders.import.button' | transloco }}
    </button>
    <button hlmBtn variant="ghost" type="button" (click)="downloadSample()">
      <ng-icon name="lucideDownload" />
      {{ 'orders.import.sample' | transloco }}
    </button>
    <button
      hlmBtn
      variant="outline"
      type="button"
      [disabled]="store.loading() || selectedIds().length === 0"
      (click)="duplicate()"
    >
      <ng-icon name="lucideCopy" />
      {{ 'orders.actions.duplicate' | transloco: { count: selectedIds().length } }}
    </button>
    <button
      hlmBtn
      variant="outline"
      type="button"
      class="text-destructive"
      [disabled]="store.loading() || selectedIds().length === 0"
      (click)="remove()"
    >
      <ng-icon name="lucideTrash2" />
      {{ 'orders.actions.remove' | transloco: { count: selectedIds().length } }}
    </button>
  </ng-container>

  @if (store.invalidCount() > 0) {
    <div
      role="alert"
      class="border-destructive/30 bg-destructive/5 text-destructive flex items-center gap-2 rounded-md border px-3 py-2 text-sm"
    >
      <ng-icon name="lucideTriangleAlert" />
      {{ invalidMessage() }}
    </div>
  }

  <ng-template appCell="product" [appCellRows]="store.lines()" let-line>
    <label class="sr-only" [for]="productControlId(line)">{{ columnText().product }}</label>
    <hlm-select
      [value]="line.productId"
      (valueChange)="edit(line, 'productId', $event)"
      [itemToString]="productName"
    >
      <hlm-select-trigger
        size="sm"
        class="w-full"
        [buttonId]="productControlId(line)"
        [forceInvalid]="hasError(line, 'productId')"
      >
        <hlm-select-value [placeholder]="'orders.placeholders.product' | transloco" />
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal>
        @for (product of store.products(); track product.id) {
          <hlm-select-item [value]="product.id">{{ product.name }}</hlm-select-item>
        }
      </hlm-select-content>
    </hlm-select>
  </ng-template>

  <ng-template appCell="quantity" [appCellRows]="store.lines()" let-line>
    <input
      hlmInput
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      class="h-8 text-end tabular-nums"
      [value]="line.quantity ?? ''"
      [forceInvalid]="hasError(line, 'quantity')"
      [attr.aria-invalid]="hasError(line, 'quantity') || null"
      [attr.aria-label]="columnText().quantity"
      (change)="edit(line, 'quantity', $any($event.target).value)"
    />
  </ng-template>

  <ng-template appCell="unitPrice" [appCellRows]="store.lines()" let-line>
    <input
      hlmInput
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      class="h-8 text-end tabular-nums"
      [value]="line.unitPrice ?? ''"
      [forceInvalid]="hasError(line, 'unitPrice')"
      [attr.aria-invalid]="hasError(line, 'unitPrice') || null"
      [attr.aria-label]="columnText().unitPrice"
      (change)="edit(line, 'unitPrice', $any($event.target).value)"
    />
  </ng-template>
</app-data-table>
