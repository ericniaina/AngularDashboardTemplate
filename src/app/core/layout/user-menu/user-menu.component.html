@if (user(); as user) {
  <button
    hlmBtn
    variant="ghost"
    class="h-9 gap-2 px-1.5"
    [hlmDropdownMenuTrigger]="menu"
    align="end"
    [attr.aria-label]="'layout.userMenu' | transloco"
  >
    <hlm-avatar class="size-7">
      <span hlmAvatarFallback class="bg-primary text-primary-foreground text-xs font-medium">{{
        initials()
      }}</span>
    </hlm-avatar>
    <span class="hidden max-w-40 truncate text-sm font-medium sm:inline">{{ user.name }}</span>
  </button>

  <ng-template #menu>
    <hlm-dropdown-menu class="w-64">
      <div class="flex flex-col gap-1 px-2 py-1.5">
        <span class="truncate text-sm font-medium">{{ user.name }}</span>
        <span class="text-muted-foreground truncate text-xs">{{ user.email }}</span>
        <div class="mt-1 flex flex-wrap gap-1">
          @for (role of user.roles; track role) {
            <span hlmBadge variant="secondary">{{ 'roles.' + role | transloco }}</span>
          }
        </div>
      </div>
      <hlm-dropdown-menu-separator />
      <button hlmDropdownMenuItem (triggered)="signOut()">
        <ng-icon name="lucideLogOut" />
        {{ 'layout.signOut' | transloco }}
      </button>
    </hlm-dropdown-menu>
  </ng-template>
}
