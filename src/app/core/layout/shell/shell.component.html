<hlm-sidebar-wrapper>
  <hlm-sidebar
    collapsible="icon"
    [srOnlySheetTitle]="'layout.navigation' | transloco"
    [srOnlySheetDescription]="'layout.navigationDescription' | transloco"
  >
    <!-- Brand row: 80×80 logo; its height (--app-header-height) is shared with the topbar so both borders line up. -->
    <hlm-sidebar-header
      class="h-(--app-header-height) justify-center border-b border-sidebar-border"
    >
      <a
        routerLink="/dashboard"
        class="ring-sidebar-ring flex min-w-0 items-center gap-3 rounded-md outline-hidden focus-visible:ring-2"
        [attr.aria-label]="'app.title' | transloco"
      >
        <img
          src="logo.svg"
          alt=""
          width="80"
          height="80"
          class="size-20 shrink-0 transition-[width,height] duration-200 ease-linear group-data-[collapsible=icon]:size-8"
        />
        <span
          class="line-clamp-2 leading-tight font-semibold group-data-[collapsible=icon]:hidden"
          [title]="'app.title' | transloco"
          >{{ 'app.title' | transloco }}</span
        >
      </a>
    </hlm-sidebar-header>

    <hlm-sidebar-content>
      @for (section of menu(); track section.labelKey) {
        <hlm-sidebar-group>
          <div hlmSidebarGroupLabel>{{ section.labelKey | transloco }}</div>
          <ul hlmSidebarMenu>
            @for (item of section.items; track item.route) {
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="item.route"
                  routerLinkActive
                  #rla="routerLinkActive"
                  [isActive]="rla.isActive"
                  [attr.aria-current]="rla.isActive ? 'page' : null"
                  [tooltip]="item.labelKey | transloco"
                >
                  <ng-icon [name]="item.icon" />
                  <span>{{ item.labelKey | transloco }}</span>
                </a>
              </li>
            }
          </ul>
        </hlm-sidebar-group>
      }
    </hlm-sidebar-content>
  </hlm-sidebar>

  <main hlmSidebarInset class="min-w-0">
    <header
      class="bg-background sticky top-0 z-10 flex h-14 shrink-0 items-center gap-2 border-b px-4 md:h-(--app-header-height)"
    >
      <button hlmSidebarTrigger [srOnlyText]="'layout.toggleSidebar' | transloco"></button>
      <!-- On mobile the sidebar is a sheet, so the brand shows here, compact. -->
      <img src="logo.svg" alt="" width="80" height="80" class="size-8 md:hidden" />
      <div class="flex-1"></div>
      <app-language-switcher />
      <app-theme-toggle />
      <app-user-menu />
    </header>

    <div class="mx-auto w-full max-w-screen-2xl p-4 md:p-6">
      <router-outlet />
    </div>
  </main>
</hlm-sidebar-wrapper>
